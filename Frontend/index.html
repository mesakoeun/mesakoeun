<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registry Management System</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .search-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .filter-item {
        display: flex;
        flex-direction: column;
      }
      label {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
      }
      input,
      select {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .button-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 20px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #1557b0;
      }
      button:disabled {
        background: #ccc;
      }

      .stats {
        margin-bottom: 15px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 6px;
        border-left: 5px solid #1a73e8;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th {
        background: #f1f3f4;
        padding: 12px;
        text-align: left;
        border-bottom: 2px solid #dee2e6;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid #eee;
      }
      tr:hover {
        background: #f1f8ff;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
      }
      .auth-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-card {
        background: white;
        width: min(900px, 94vw);
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registry Search</h2>
      <div class="auth-row">
        <div>
          <strong id="authStatus">Not logged in</strong><br />
          <small>Admin: admin / admin123 • User: user / user123</small>
        </div>
        <div class="button-row" style="margin-bottom: 0; justify-content: flex-end;">
          <button id="loginAdminBtn" type="button">Login as Admin</button>
          <button id="loginUserBtn" type="button" style="background: #6c757d;">Login as User</button>
          <button id="logoutBtn" type="button" style="background: #dc3545;">Logout</button>
        </div>
      </div>

      <div class="search-grid">
        <div class="filter-item">
          <label>Given Name</label><input type="text" id="givenname" />
        </div>
        <div class="filter-item">
          <label>Surname</label><input type="text" id="surname" />
        </div>
        <div class="filter-item">
          <label>Gender</label>
          <select id="gender">
            <option value="">All</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Age From</label
          ><input type="number" id="age_from" placeholder="18" />
        </div>
        <div class="filter-item">
          <label>Age To</label
          ><input type="number" id="age_to" placeholder="50" />
        </div>
      </div>

      <div class="search-grid">
        <div class="filter-item">
          <label>Province</label
          ><select id="province">
            <option value="">Select Province</option>
          </select>
        </div>
        <div class="filter-item">
          <label>District</label
          ><select id="district" disabled>
            <option value="">Select District</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Commune</label
          ><select id="commune" disabled>
            <option value="">Select Commune</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Village</label
          ><select id="village" disabled>
            <option value="">Select Village</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button id="addPersonBtn" type="button" style="background: #28a745; display: none;">Add Person</button>
        <button onclick="resetFilters()" style="background: #6c757d">
          Reset
        </button>

        <button
          onclick="
            clearResults();
            generateReport();
          "
          style="background: #28a745"
        >
          Generate Demographic Report
        </button>

        <button
          onclick="
            clearResults();
            searchPeople(1);
          "
        >
          Search Records
        </button>
      </div>

      <div id="stats-container" class="stats" style="display: none"></div>

      <table id="peopleTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Date of Birth</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="5" style="text-align: center">
              Use filters to begin searching.
            </td>
          </tr>
        </tbody>
      </table>

      <div class="table-container">
        <table id="reportTable">
          <thead>
            <tr></tr>
          </thead>
          <tbody>
            <tr>
              <td style="text-align: center">
                Select filters and click Generate Report
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="pagination-controls" class="pagination"></div>
    </div>

    <div id="personModal" class="modal-backdrop">
      <div class="modal-card">
        <h3 id="modalTitle">Person Details</h3>
        <div id="modalMessage" style="color: #0b6bcb; margin-bottom: 10px;"></div>
        <div id="personForm" class="modal-grid"></div>
        <div id="historyBox" style="margin-top: 12px; max-height: 320px; overflow-y: auto; padding-right: 6px;"></div>
        <div class="button-row" style="justify-content: flex-end; margin-top: 12px;">
          <button id="savePersonBtn" type="button" style="background: #28a745; display: none;">Save</button>
          <button id="closeModalBtn" type="button" style="background: #6c757d;">Close</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
