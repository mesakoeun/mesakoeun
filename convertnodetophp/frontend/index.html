<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registry Management - PHP API Frontend</title>
    <style>
      body { font-family: "Segoe UI", sans-serif; background: #f0f2f5; padding: 20px; }
      .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
      .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
      .filter-item { display:flex; flex-direction:column }
      label { font-size:12px; font-weight:600; margin-bottom:6px; color:#444 }
      input, select { padding:10px; border:1px solid #ddd; border-radius:6px }
      .button-row { display:flex; justify-content:flex-end; gap:10px; margin-bottom:20px }
      button { padding:10px 20px; background:#1a73e8; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:700 }
      button[disabled] { background:#ccc }
      .stats { margin-bottom:15px; padding:10px; background:#f8f9fa; border-left:5px solid #1a73e8; border-radius:6px }
      table { width:100%; border-collapse:collapse }
      th { background:#f1f3f4; padding:12px; text-align:left; border-bottom:2px solid #dee2e6 }
      td { padding:12px; border-bottom:1px solid #eee }
      tr:hover { background:#f1f8ff }
      .pagination { display:flex; justify-content:center; gap:20px; margin-top:20px }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registry Search (PHP API)</h2>

      <div class="search-grid">
        <div class="filter-item"><label>Given Name</label><input id="givenname" /></div>
        <div class="filter-item"><label>Surname</label><input id="surname" /></div>
        <div class="filter-item"><label>Gender</label>
          <select id="gender"><option value="">All</option><option>Male</option><option>Female</option></select>
        </div>
        <div class="filter-item"><label>Age From</label><input type="number" id="age_from" /></div>
        <div class="filter-item"><label>Age To</label><input type="number" id="age_to" /></div>
      </div>

      <div class="search-grid">
        <div class="filter-item"><label>Province</label><select id="province"><option value="">Select Province</option></select></div>
        <div class="filter-item"><label>District</label><select id="district" disabled><option value="">Select District</option></select></div>
        <div class="filter-item"><label>Commune</label><select id="commune" disabled><option value="">Select Commune</option></select></div>
        <div class="filter-item"><label>Village</label><select id="village" disabled><option value="">Select Village</option></select></div>
      </div>

      <div class="button-row">
        <button onclick="resetFilters()" style="background:#6c757d">Reset</button>
        <button onclick="clearResults(); generateReport();" style="background:#28a745">Generate Demographic Report</button>
        <button onclick="clearResults(); searchPeople(1)">Search Records</button>
      </div>

      <div id="stats-container" class="stats" style="display:none"></div>

      <table id="peopleTable">
        <thead>
          <tr><th>ID</th><th>Full Name</th><th>Gender</th><th>Age</th><th>Date of Birth</th></tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="5" style="text-align:center">Use filters to begin searching.</td></tr></tbody>
      </table>

      <div class="table-container" style="margin-top:20px">
        <table id="reportTable"><thead><tr></tr></thead><tbody><tr><td style="text-align:center">Select filters and click Generate Report</td></tr></tbody></table>
      </div>
      <div id="pagination-controls" class="pagination"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
